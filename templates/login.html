<!DOCTYPE html>
<html>
<head>
  <title>Login - FastAPI App</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; text-align: center; margin-top: 100px; }
    form { display: inline-block; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input { padding: 10px; margin: 10px; width: 200px; }
    button { padding: 10px 20px; background: #0078D4; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Login to FastAPI App</h2>
  <form action="/login" method="post">
    <input type="text" name="username" placeholder="Username" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>
</body>
</html>
