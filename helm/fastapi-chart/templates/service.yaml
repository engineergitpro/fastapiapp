apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastapi-chart.fullname" . }}
  labels:
    app: {{ include "fastapi-chart.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "fastapi-chart.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
