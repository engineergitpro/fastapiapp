replicaCount: 2

image:
  repository: aksclusteregistry.azurecr.io/fastapiapp
  tag: v1
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  - name: ENVIRONMENT
    value: "production"
  - name: APP_NAME
    value: "FastAPI App on AKS"
