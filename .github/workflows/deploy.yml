name: Build and Deploy FastAPI to AKS

on:
  push:
    branches:
      - main  # Trigger on main branch changes

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image to ACR
        run: |
          echo "Building image: ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing


      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy to AKS with Helm
        run: |
          helm upgrade --install fastapi-release ./helm/fastapi-chart \
          --set image.repository=${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.IMAGE_NAME }} \
          --set image.tag=${{ env.IMAGE_TAG }} \
          --set image.pullPolicy=Always \
          --atomic --timeout 5m --cleanup-on-fail
